<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>html{scroll-behavior:smooth}body{margin:0;background:#fff}a{color:#A31631;text-decoration:none}a:hover{color:#6E1423}</style>
</helmet>
<div style="font-family:'IBM Plex Sans',sans-serif;color:#26282B">
<dc-import name="SiteHeader" style="position:sticky;top:0;z-index:1000;display:block" hint-size="100%,116px"></dc-import>
<div id="main" tabindex="-1"></div>

<section data-screen-label="Insights hero" style="background:linear-gradient(135deg,#4E0D19,#6E1423);position:relative;overflow:hidden">
  <div style="position:absolute;top:-260px;right:-160px;width:560px;height:560px;border-radius:50%;background:#8E2136;opacity:0.5"></div>
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:72px 48px 80px">
    <div style="font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#D98A94;margin-bottom:14px">{{ tKicker }}</div>
    <h1 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(32px,5vw,46px);color:#fff;margin:0 0 18px;max-width:760px;text-wrap:pretty">{{ tHeroTitle }}</h1>
    <p style="font-size:17.5px;line-height:1.65;color:rgba(255,255,255,0.82);margin:0;max-width:640px">{{ tHeroSub }}</p>
  </div>
</section>

<section data-screen-label="Articles" style="background:#F6F4F2">
  <div style="max-width:1240px;margin:0 auto;padding:56px 48px 88px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="7">
        <button onClick="{{ f.select }}" style="font-family:'Manrope',sans-serif;font-weight:600;font-size:13.5px;padding:8px 16px;border-radius:2px;cursor:pointer;border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.color }}">{{ f.name }}</button>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px">
      <sc-for list="{{ articles }}" as="a" hint-placeholder-count="9">
        <a href="{{ a.href }}" style="background:#fff;border:1px solid #E8E4E1;border-radius:4px;padding:28px;display:flex;flex-direction:column;gap:13px;color:#26282B" style-hover="border-color:#6E1423;box-shadow:0 8px 24px rgba(110,20,35,0.08);color:#26282B">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
            <span style="font-family:'Manrope',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;color:#A31631;background:#F7EBED;padding:4px 10px;border-radius:2px">{{ a.tag }}</span>
            <span style="font-size:12.5px;color:#6B7075">{{ a.date }}</span>
          </div>
          <div style="font-family:'Manrope',sans-serif;font-weight:700;font-size:19px;line-height:1.3;text-wrap:pretty">{{ a.title }}</div>
          <div style="font-size:14px;color:#5C6166;line-height:1.55;flex:1">{{ a.excerpt }}</div>
          <span style="font-family:'Manrope',sans-serif;font-weight:700;font-size:13.5px;color:#A31631">{{ tReadMore }} →</span>
        </a>
      </sc-for>
    </div>
  </div>
</section>

<section data-screen-label="Newsletter" style="background:#26282B">
  <div style="max-width:1240px;margin:0 auto;padding:64px 48px;display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap">
    <div>
      <h2 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;color:#fff;margin:0 0 8px">{{ tNlTitle }}</h2>
      <p style="margin:0;font-size:15.5px;color:#9BA0A5">{{ tNlSub }}</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input placeholder="{{ tPhEmail }}" style="font-family:'IBM Plex Sans',sans-serif;font-size:15px;padding:13px 18px;border-radius:3px;border:1px solid #4A4E52;background:#2E3134;color:#fff;min-width:260px;outline:none">
      <a href="Resources.dc.html#newsletter" style="background:#6E1423;color:#fff;font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;padding:13px 26px;border-radius:3px;display:flex;align-items:center" style-hover="background:#A31631;color:#fff">{{ tSubscribe }}</a>
    </div>
  </div>
</section>

<dc-import name="SiteFooter" hint-size="100%,460px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'All', lang: 'EN' };
  componentDidMount() {
    try { const l = localStorage.getItem('ecovis-lang'); if (l) this.setState({ lang: l }); } catch (e) {}
    this._onLang = (e) => this.setState({ lang: (e && e.detail) || 'EN' });
    window.addEventListener('ecovis-lang', this._onLang);
  }
  componentWillUnmount() { if (this._onLang) window.removeEventListener('ecovis-lang', this._onLang); }
  renderVals() {
    const id = this.state.lang === 'ID';
    const pick = (en, idn) => (id ? idn : en);
    const catLabel = {
      'All': pick('All', 'Semua'),
      'Tax Alerts': pick('Tax Alerts', 'Alert Pajak'),
      'Accounting Updates': pick('Accounting Updates', 'Pembaruan Akuntansi'),
      'Audit Insights': pick('Audit Insights', 'Wawasan Audit'),
      'Legal Updates': pick('Legal Updates', 'Pembaruan Hukum'),
      'Indonesia Business': pick('Indonesia Business', 'Bisnis Indonesia'),
      'Investment': pick('Investment', 'Investasi')
    };
    const cats = ['All', 'Tax Alerts', 'Accounting Updates', 'Audit Insights', 'Legal Updates', 'Indonesia Business', 'Investment'];
    const rows = [
      ['vat-12', 'Tax Alerts', 'Jul 2026',
        'VAT at 12%: Transition Rules Every Business Should Review', 'PPN 12%: Aturan Transisi yang Perlu Ditinjau Setiap Bisnis',
        'How the luxury-goods carve-out works in practice, and what to update in your invoicing and ERP systems now.', 'Cara kerja pengecualian barang mewah dalam praktik, dan yang perlu diperbarui di sistem faktur dan ERP Anda sekarang.'],
      ['coretax-year-one', 'Tax Alerts', 'Jun 2026',
        'Filing Under Coretax: Lessons From the First Full Year', 'Pelaporan di Coretax: Pelajaran dari Tahun Pertama',
        'Practical fixes for the most common e-Faktur and e-Bupot migration issues we see across client systems.', 'Solusi praktis untuk masalah migrasi e-Faktur dan e-Bupot yang paling umum kami temui di sistem klien.'],
      ['pt-pma-2026', 'Indonesia Business', 'Jun 2026',
        'Setting Up a PT PMA in 2026: A Step-by-Step Guide', 'Mendirikan PT PMA di 2026: Panduan Langkah demi Langkah',
        'Capital requirements, OSS risk-based licensing and realistic timelines for foreign investors entering Indonesia.', 'Persyaratan modal, perizinan berbasis risiko OSS, dan lini waktu realistis bagi investor asing yang masuk Indonesia.'],
      ['pmk-172-tp', 'Tax Alerts', 'May 2026',
        'PMK-172 Transfer Pricing Documentation: Deadlines and Thresholds', 'Dokumentasi Transfer Pricing PMK-172: Tenggat dan Ambang',
        'Which entities must prepare Master File and Local File, and why the availability deadline is earlier than you think.', 'Entitas mana yang wajib menyiapkan Master File dan Local File, dan mengapa availability deadline lebih awal dari yang Anda kira.'],
      ['psak-ifrs-2026', 'Accounting Updates', 'May 2026',
        'PSAK vs IFRS in 2026: The Differences That Still Matter', 'PSAK vs IFRS di 2026: Perbedaan yang Masih Penting',
        'A concise difference memo for group controllers consolidating Indonesian subsidiaries.', 'Memo perbedaan ringkas untuk group controller yang mengonsolidasikan anak usaha Indonesia.'],
      ['uu-pdp-employers', 'Legal Updates', 'Apr 2026',
        'UU PDP in Force: Data-Protection Duties for Employers', 'UU PDP Berlaku: Kewajiban Perlindungan Data bagi Pemberi Kerja',
        'What Indonesia\\u2019s personal data protection law means for HR files, payroll data and cross-border transfers.', 'Apa arti UU Perlindungan Data Pribadi Indonesia bagi berkas HR, data penggajian, dan transfer lintas negara.'],
      ['audit-foreign-owned', 'Audit Insights', 'Apr 2026',
        'Audit Requirements for Foreign-Owned Companies in Indonesia', 'Persyaratan Audit untuk Perusahaan Milik Asing di Indonesia',
        'When a statutory audit becomes mandatory — thresholds, deadlines and what first-year audits typically uncover.', 'Kapan audit statutori menjadi wajib — ambang, tenggat, dan apa yang biasanya terungkap dari audit tahun pertama.'],
      ['priority-sectors', 'Investment', 'Mar 2026',
        'Indonesia\\u2019s Priority Sectors: Where Incentives Are Strongest', 'Sektor Prioritas Indonesia: Di Mana Insentif Paling Kuat',
        'Tax holidays, allowances and import facilities mapped against the government\\u2019s downstreaming agenda.', 'Tax holiday, tunjangan, dan fasilitas impor dipetakan terhadap agenda hilirisasi pemerintah.'],
      ['wage-bpjs-2026', 'Indonesia Business', 'Mar 2026',
        '2026 Minimum Wage and BPJS Updates by Province', 'Pembaruan Upah Minimum dan BPJS 2026 per Provinsi',
        'Provincial wage decisions and social-security ceiling changes to reflect in January payroll runs.', 'Keputusan upah provinsi dan perubahan batas jaminan sosial untuk dicerminkan pada penggajian Januari.']
    ];
    const all = rows.map(([slug, tag, date, tEn, tId, eEn, eId]) => ({
      slug, tag, date, tagLabel: catLabel[tag] || tag,
      title: id ? tId : tEn, excerpt: id ? eId : eEn,
      href: 'ArticleDetail.dc.html#' + slug
    }));
    const f = this.state.filter;
    const shown = f === 'All' ? all : all.filter(a => a.tag === f);
    return {
      tKicker: pick('Insights', 'Wawasan'),
      tHeroTitle: pick("What's changing in Indonesian business — and what to do about it", 'Apa yang berubah dalam bisnis Indonesia — dan apa yang harus dilakukan'),
      tHeroSub: pick('Tax alerts, regulatory updates and practical guides written by the professionals who apply these rules every day.', 'Alert pajak, pembaruan regulasi, dan panduan praktis yang ditulis oleh profesional yang menerapkan aturan ini setiap hari.'),
      tReadMore: pick('Read more', 'Baca selengkapnya'),
      tNlTitle: pick('Get tax alerts before the deadline, not after', 'Dapatkan alert pajak sebelum tenggat, bukan sesudah'),
      tNlSub: pick('A short monthly briefing on Indonesian tax, regulatory and business developments.', 'Briefing bulanan singkat tentang perkembangan pajak, regulasi, dan bisnis Indonesia.'),
      tPhEmail: pick('Work email', 'Email kantor'),
      tSubscribe: pick('Subscribe', 'Berlangganan'),
      filters: cats.map(key => ({
        name: catLabel[key] || key,
        select: () => this.setState({ filter: key }),
        bg: f === key ? '#6E1423' : '#fff',
        color: f === key ? '#fff' : '#5C6166',
        border: f === key ? '#6E1423' : '#DDD9D5'
      })),
      articles: shown.map(a => ({ ...a, tag: a.tagLabel }))
    };
  }
}
</script>
</body>
</html>
